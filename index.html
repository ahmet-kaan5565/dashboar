<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT Dashboard</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
  :root {
    --bg:#0f0f0f; --surface:#1a1a1a; --surface2:#242424;
    --border:#2a2a2a; --text:#e8e8e8; --muted:#666;
    --accent:#3b82f6; --green:#22c55e; --red:#ef4444;
    --font:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;}

  /* LOGIN */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;}
  .login-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2.5rem;width:100%;max-width:380px;}
  .login-logo{font-size:36px;margin-bottom:1rem;}
  .login-box h1{font-size:22px;font-weight:700;margin-bottom:4px;}
  .login-box p{font-size:13px;color:var(--muted);margin-bottom:2rem;}
  .field{margin-bottom:1rem;}
  .field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;font-weight:500;}
  .field input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;color:var(--text);font-size:14px;font-family:var(--font);outline:none;transition:border-color .15s;}
  .field input:focus{border-color:var(--accent);}
  .login-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;margin-top:.5rem;transition:opacity .15s;}
  .login-btn:hover{opacity:.88;}
  #login-error{font-size:13px;color:var(--red);margin-top:12px;display:none;text-align:center;}

  /* HEADER */
  #dashboard{display:none;}
  header{border-bottom:1px solid var(--border);padding:0 1.5rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(15,15,15,.92);backdrop-filter:blur(8px);z-index:10;}
  .header-left{display:flex;align-items:center;gap:10px;}
  header h1{font-size:15px;font-weight:700;}
  .badge{font-size:10px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3px 9px;font-family:var(--mono);}
  .conn-indicator{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
  .conn-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);transition:background .3s;}
  .conn-dot.connected{background:var(--green);}
  main{padding:1.5rem;max-width:1200px;margin:0 auto;}
  .empty-state{text-align:center;padding:5rem 1rem;color:var(--muted);}
  .empty-state .icon{font-size:52px;margin-bottom:1rem;opacity:.2;}
  .empty-state p{font-size:14px;line-height:1.8;}
  .devices-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1rem;}

  /* CARD */
  .device-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;transition:border-color .2s;}
  .device-card:hover{border-color:#383838;}
  .device-header{padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .device-name-wrap{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .device-icon{width:30px;height:30px;border-radius:9px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;transition:outline .15s;flex-shrink:0;}
  .device-icon:hover{outline:2px solid var(--accent);outline-offset:1px;}
  .device-icon img{width:30px;height:30px;border-radius:9px;object-fit:cover;display:block;}
  .device-header-right{display:flex;align-items:center;gap:8px;}
  .device-status{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:600;}
  .device-status.online{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.2);}
  .device-status.offline{background:rgba(239,68,68,.1);color:var(--red);border:1px solid rgba(239,68,68,.2);}
  .param-badge{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:600;background:rgba(59,130,246,.1);color:var(--accent);border:1px solid rgba(59,130,246,.2);font-family:var(--mono);display:inline-flex;align-items:center;gap:5px;position:relative;}
  .param-badge.warn{background:rgba(239,68,68,.08);color:var(--red);border-color:rgba(239,68,68,.25);cursor:pointer;}
  .param-dot{width:6px;height:6px;border-radius:50%;background:var(--red);}
  .param-tooltip{display:none;position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px;min-width:200px;z-index:30;box-shadow:0 8px 32px rgba(0,0,0,.6);}
  .param-badge.warn:hover .param-tooltip{display:block;}
  .param-tooltip-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;font-weight:600;}
  .param-tooltip-item{font-size:12px;color:var(--red);padding:2px 0;}
  .sensors-grid{padding:1rem 1.25rem;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .sensor-item{background:var(--surface2);border-radius:12px;padding:10px 12px;}
  .sensor-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;font-weight:500;}
  .sensor-value{font-size:24px;font-weight:700;font-family:var(--mono);line-height:1;}
  .sensor-unit{font-size:13px;font-weight:400;color:var(--muted);margin-left:2px;}
  .device-footer{padding:8px 1.25rem;border-top:1px solid var(--border);font-size:10px;color:var(--muted);font-family:var(--mono);display:flex;justify-content:space-between;}

  /* CHART */
  .chart-section{border-top:1px solid var(--border);}
  .chart-header{display:flex;align-items:center;justify-content:space-between;padding:10px 1.25rem 4px;}
  .chart-label{font-size:11px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px;}
  .chart-mode-badge{font-size:10px;color:var(--accent);background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.2);border-radius:20px;padding:2px 7px;font-family:var(--mono);}
  .chart-menu-wrap{position:relative;}
  .chart-menu-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:2px 6px;border-radius:6px;line-height:1;}
  .chart-menu-btn:hover{background:var(--surface2);color:var(--text);}
  .chart-menu{display:none;position:absolute;top:calc(100% + 6px);right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px;min-width:140px;z-index:25;box-shadow:0 8px 24px rgba(0,0,0,.5);}
  .chart-menu.open{display:block;}
  .chart-menu-item{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;font-size:12px;cursor:pointer;transition:background .12s;}
  .chart-menu-item:hover{background:var(--surface2);}
  .chart-menu-item.active{color:var(--accent);}
  .chart-body{padding:4px 1.25rem 1rem;}
  .chart-svg{width:100%;display:block;}
  .chart-loading{font-size:12px;color:var(--muted);padding:20px 0;text-align:center;}
  .chart-stats{display:flex;gap:14px;margin-top:6px;flex-wrap:wrap;}
  .chart-stat{font-size:10px;font-family:var(--mono);}
  .chart-stat span{color:var(--muted);}

  /* LIST MODE */
  .device-list-item{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:border-color .15s,transform .1s;margin-bottom:10px;}
  .device-list-item:hover{border-color:var(--accent);transform:translateX(3px);}
  .device-list-left{display:flex;align-items:center;gap:12px;}
  .device-list-meta{font-size:11px;color:var(--muted);margin-top:2px;}
  .device-list-arrow{color:var(--muted);font-size:16px;}
  .device-detail-header{margin-bottom:1rem;}
  .device-detail-header h2{font-size:22px;font-weight:700;}

  /* BUTTONS */
  .logout-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer;transition:all .15s;}
  .logout-btn:hover{border-color:var(--red);color:var(--red);}
  .icon-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;transition:all .15s;}
  .icon-btn:hover{border-color:var(--accent);color:var(--text);}

  /* SETTINGS */
  .settings-panel{display:none;position:fixed;top:64px;right:1.5rem;z-index:20;}
  .settings-panel.open{display:block;}
  .settings-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.25rem;width:280px;box-shadow:0 8px 32px rgba(0,0,0,.5);}
  .settings-box h3{font-size:11px;font-weight:600;margin-bottom:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  .radio-row{display:flex;align-items:flex-start;gap:10px;padding:10px;border-radius:10px;cursor:pointer;transition:background .15s;}
  .radio-row:hover{background:var(--surface2);}
  .radio-row input{margin-top:3px;accent-color:var(--accent);}
  .radio-title{font-size:13px;font-weight:500;}
  .radio-desc{font-size:11px;color:var(--muted);margin-top:2px;}

  /* MODAL */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;align-items:center;justify-content:center;padding:1rem;}
  .modal-overlay.open{display:flex;}
  .modal-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1.5rem;width:100%;max-width:400px;}
  .modal-box h3{font-size:16px;font-weight:700;margin-bottom:1.25rem;}
  .emoji-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:1rem;}
  .emoji-opt{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 0;font-size:16px;cursor:pointer;text-align:center;transition:border-color .15s;}
  .emoji-opt:hover{border-color:var(--accent);}
  .emoji-opt.selected{border-color:var(--accent);background:rgba(59,130,246,.12);}
  .modal-actions{display:flex;gap:8px;margin-top:1.25rem;}
  .modal-actions button{flex:1;border-radius:10px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);}
  .modal-save{background:var(--accent)!important;color:#fff;border:none!important;}
  .modal-cancel{background:none;color:var(--muted);}

  @media(max-width:600px){
    main{padding:1rem;}
    .devices-grid{grid-template-columns:1fr;}
    header{padding:0 1rem;}
    .badge{display:none;}
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">📡</div>
    <h1>IoT Dashboard</h1>
    <p>Firebase ile doğrudan bağlanın</p>
    <div class="field">
      <label>Erişim Şifresi</label>
      <input type="password" id="inp-pass" placeholder="Şifrenizi girin" autocomplete="off">
    </div>
    <button class="login-btn" onclick="doLogin()">Giriş</button>
    <div id="login-error">Hatalı şifre.</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header>
    <div class="header-left">
      <h1>IoT Dashboard</h1>
      <span class="badge">Firebase Realtime</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="conn-indicator">
        <div class="conn-dot" id="conn-dot"></div>
        <span id="conn-text">Bağlanıyor...</span>
      </div>
      <button class="icon-btn" id="back-btn" onclick="showDeviceList()" style="display:none">← Geri</button>
      <button class="icon-btn" onclick="toggleSettings()">⚙</button>
      <button class="logout-btn" onclick="doLogout()">Çıkış</button>
    </div>
  </header>

  <div id="settings-panel" class="settings-panel">
    <div class="settings-box">
      <h3>Görünüm</h3>
      <label class="radio-row">
        <input type="radio" name="viewmode" value="list" onchange="setViewMode('list')">
        <div><div class="radio-title">Liste modu</div><div class="radio-desc">Önce cihazlar, tıklayınca detay</div></div>
      </label>
      <label class="radio-row">
        <input type="radio" name="viewmode" value="all" onchange="setViewMode('all')">
        <div><div class="radio-title">Tümünü göster</div><div class="radio-desc">Tüm kartlar aynı anda</div></div>
      </label>
    </div>
  </div>

  <main>
    <div id="empty-state" class="empty-state">
      <div class="icon">📡</div>
      <p>Cihaz bekleniyor...<br>ESP8266 veri gönderdiğinde otomatik görünecek.</p>
    </div>
    <div class="devices-grid" id="devices-grid"></div>
  </main>
</div>

<!-- CİHAZ DÜZENLEME MODALİ -->
<div id="device-modal" class="modal-overlay">
  <div class="modal-box">
    <h3>Cihazı düzenle</h3>
    <div class="field">
      <label>Görünen isim</label>
      <input type="text" id="modal-name" placeholder="Örn. Yatak Odası">
    </div>
    <div class="field">
      <label>İkon seç</label>
      <div class="emoji-grid" id="emoji-grid"></div>
    </div>
    <div class="field">
      <label>Foto URL'si (ikon yerine)</label>
      <input type="text" id="modal-photo" placeholder="https://...">
    </div>
    <div class="field">
      <label>Beklenen parametre sayısı <span style="color:var(--muted);font-weight:400">(boş = otomatik)</span></label>
      <input type="number" id="modal-expected" placeholder="Örn. 4" min="1" max="20">
    </div>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeDeviceModal()">Vazgeç</button>
      <button class="modal-save" onclick="saveDeviceModal()">Kaydet</button>
    </div>
  </div>
</div>

<script>
// ==================== FİREBASE ====================
const FB_CFG = {
  apiKey:            "AIzaSyAaSlbKLJxQIqGzaUXsIt8RwGM8XM9fg7w",
  authDomain:        "dashboardveritabani.firebaseapp.com",
  projectId:         "dashboardveritabani",
  storageBucket:     "dashboardveritabani.firebasestorage.app",
  messagingSenderId: "995887991284",
  appId:             "1:995887991284:web:55b1706cfcd059816ad1a1"
};
firebase.initializeApp(FB_CFG);
const db = firebase.firestore();

// Basit şifre koruması (Firestore kuralları zaten korur, bu sadece UI için)
// Şifreyi kendine göre değiştir:
const DASHBOARD_PASS = "iot2025";

// ==================== SABITLER ====================
const SENSOR_META = {
  sicaklik:{ label:'Sıcaklık', unit:'°C',  icon:'🌡', color:'#f97316' },
  nem:     { label:'Nem',      unit:'%',   icon:'💧', color:'#3b82f6' },
  saat:    { label:'Saat',     unit:'',    icon:'🕐', color:'#8b5cf6' },
  tarih:   { label:'Tarih',    unit:'',    icon:'📅', color:'#64748b' },
};
const CHART_PARAMS  = ['sicaklik','nem'];
const ICON_OPTIONS  = ['📦','🏠','🛏️','🛋️','🍳','🚪','🌳','🏢','🧊','🔥','🐾','🚗','💡','🌡️'];

// ==================== STATE ====================
let devices      = {};   // { id: { sensors, lastUpdate, seenParams, fbHistory } }
let deviceCfg    = {};   // { id: { name, icon, photo, expectedParams } }
let chartModes   = {};   // { 'cihaz_param': 'live'|'15m'|'1d' }
let listeners    = [];   // Firestore realtime listener'ları (temizlik için)
let viewMode     = localStorage.getItem('view_mode') || 'list';
let activeDevice = null;
let modalTarget  = null;
let modalSelIcon = null;

// ==================== GİRİŞ ====================
function doLogin() {
  const pass = document.getElementById('inp-pass').value;
  if (pass !== DASHBOARD_PASS) {
    document.getElementById('login-error').style.display = 'block';
    return;
  }
  localStorage.setItem('dash_auth', '1');
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display    = 'block';
  startListening();
}

function doLogout() {
  stopListening();
  devices = {}; deviceCfg = {}; activeDevice = null;
  localStorage.removeItem('dash_auth');
  document.getElementById('devices-grid').innerHTML = '';
  document.getElementById('empty-state').style.display = 'block';
  document.getElementById('dashboard').style.display   = 'none';
  document.getElementById('login-screen').style.display= 'flex';
  document.getElementById('inp-pass').value = '';
}

function stopListening() {
  listeners.forEach(unsub => unsub());
  listeners = [];
}

// ==================== FİRESTORE DİNLEME ====================
function startListening() {
  setConnStatus('', 'Bağlanıyor...');

  // Tüm cihazları keşfet: cihazlar koleksiyonunu dinle
  // Her cihazın /canli/veri dokümanı realtime güncellenir
  const unsub = db.collection('cihazlar').onSnapshot(snap => {
    snap.forEach(doc => {
      const cihazId = doc.id;
      if (!devices[cihazId]) {
        devices[cihazId] = { sensors:{}, lastUpdate:null, seenParams:new Set(), fbHistory:{} };
        listenCihaz(cihazId);     // bu cihazın canlı verisini dinle
        loadDeviceCfg(cihazId);   // cihaz ayarlarını yükle
      }
    });
  }, err => {
    setConnStatus('', 'Bağlantı hatası');
    console.error(err);
  });
  listeners.push(unsub);
}

function listenCihaz(cihazId) {
  // cihazlar/{id}/canli/veri dokümanını realtime dinle
  const unsub = db
    .collection('cihazlar').doc(cihazId)
    .collection('canli').doc('veri')
    .onSnapshot(snap => {
      if (!snap.exists) return;
      const data = snap.data();

      if (!devices[cihazId])
        devices[cihazId] = { sensors:{}, lastUpdate:null, seenParams:new Set(), fbHistory:{} };

      // Tüm alanları sensör olarak kaydet (durum hariç)
      Object.entries(data).forEach(([k, v]) => {
        if (k === 'ts' || k === 'durum') return;
        devices[cihazId].sensors[k] = String(v);
        devices[cihazId].seenParams.add(k);

        // Canlı grafik için RAM'de tut
        if (CHART_PARAMS.includes(k)) {
          const num = parseFloat(v);
          if (!isNaN(num)) {
            const key = k + '_live';
            if (!devices[cihazId].fbHistory[key]) devices[cihazId].fbHistory[key] = [];
            devices[cihazId].fbHistory[key].push({ v:num, t:data.ts || Date.now() });
            if (devices[cihazId].fbHistory[key].length > 40)
              devices[cihazId].fbHistory[key].shift();
          }
        }
      });

      devices[cihazId].status     = data.durum || 'offline';
      devices[cihazId].lastUpdate = new Date();

      setConnStatus('connected', 'Bağlı');
      renderAll();
    }, err => console.error('Cihaz dinleme hatası:', cihazId, err));

  listeners.push(unsub);
}

// ==================== FİRESTORE: CİHAZ AYARLARI ====================
async function loadDeviceCfg(cihazId) {
  try {
    const doc = await db.collection('cihazlar').doc(cihazId).get();
    if (doc.exists && doc.data().cfg) {
      deviceCfg[cihazId] = doc.data().cfg;
      renderAll();
    }
  } catch(e) { console.warn('cfg yüklenemedi:', e); }
}

async function saveDeviceCfgToFirestore(cihazId, cfg) {
  try {
    await db.collection('cihazlar').doc(cihazId).set({ cfg }, { merge:true });
  } catch(e) { console.error('cfg kaydetme hatası:', e); }
}

// ==================== FİRESTORE: GEÇMİŞ VERİ ====================
async function fetchHistory(cihazId, param, mode) {
  const now = Date.now();
  const startMs = mode === '15m' ? now - 15*60*1000 : now - 24*60*60*1000;

  try {
    const snap = await db
      .collection('cihazlar').doc(cihazId)
      .collection('gecmis')
      .where('ts', '>=', startMs)
      .orderBy('ts', 'asc')
      .get();

    const result = [];
    snap.forEach(doc => {
      const d = doc.data();
      if (d[param] !== undefined) result.push({ v: parseFloat(d[param]), t: d.ts });
    });
    return result;
  } catch(e) {
    console.warn('Geçmiş veri hatası:', e);
    return [];
  }
}

// ==================== GRAFİK MODU ====================
function toggleChartMenu(key) {
  event.stopPropagation();
  document.querySelectorAll('.chart-menu').forEach(m => {
    if (m.dataset.key !== key) m.classList.remove('open');
  });
  const menu = document.querySelector(`.chart-menu[data-key="${key}"]`);
  if (menu) menu.classList.toggle('open');
}

async function setChartMode(cihazId, param, mode) {
  const key = cihazId + '_' + param;
  chartModes[key] = mode;
  document.querySelectorAll('.chart-menu').forEach(m => m.classList.remove('open'));

  if (mode !== 'live') {
    const el = document.getElementById('chartbody_' + key);
    if (el) el.innerHTML = '<div class="chart-loading">Yükleniyor...</div>';
    const data = await fetchHistory(cihazId, param, mode);
    if (!devices[cihazId]) return;
    devices[cihazId].fbHistory[param + '_' + mode] = data;
  }
  renderAll();
}

function getChartData(cihazId, param) {
  const key  = cihazId + '_' + param;
  const mode = chartModes[key] || 'live';
  if (mode === 'live') {
    return { data: devices[cihazId]?.fbHistory?.[param+'_live'] || [], mode };
  }
  return { data: devices[cihazId]?.fbHistory?.[param+'_'+mode] || [], mode };
}

// ==================== CİHAZ AYAR MODALİ ====================
function openDeviceModal(cihazId) {
  event.stopPropagation();
  modalTarget  = cihazId;
  const cfg    = deviceCfg[cihazId] || {};
  const d      = devices[cihazId]   || {};
  modalSelIcon = cfg.icon || '📦';

  document.getElementById('modal-name').value     = cfg.name  || cihazId;
  document.getElementById('modal-photo').value    = cfg.photo || '';
  const autoExp = d.seenParams ? d.seenParams.size : 0;
  document.getElementById('modal-expected').value = cfg.expectedParams != null ? cfg.expectedParams : autoExp;

  document.getElementById('emoji-grid').innerHTML = ICON_OPTIONS.map(ic =>
    `<div class="emoji-opt ${ic===modalSelIcon?'selected':''}" onclick="selectIcon('${ic}')">${ic}</div>`
  ).join('');

  document.getElementById('device-modal').classList.add('open');
}

function selectIcon(ic) {
  modalSelIcon = ic;
  document.querySelectorAll('#emoji-grid .emoji-opt').forEach(el =>
    el.classList.toggle('selected', el.textContent === ic));
}
function closeDeviceModal() {
  document.getElementById('device-modal').classList.remove('open');
  modalTarget = null;
}
async function saveDeviceModal() {
  if (!modalTarget) return;
  const name    = document.getElementById('modal-name').value.trim();
  const photo   = document.getElementById('modal-photo').value.trim();
  const expRaw  = parseInt(document.getElementById('modal-expected').value);
  const expected= isNaN(expRaw)||expRaw<1 ? null : expRaw;
  const cfg = { name:name||modalTarget, icon:modalSelIcon||'📦', photo:photo||null, expectedParams:expected };
  deviceCfg[modalTarget] = cfg;
  await saveDeviceCfgToFirestore(modalTarget, cfg);
  closeDeviceModal();
  renderAll();
}

// ==================== AYARLAR ====================
function toggleSettings() {
  document.getElementById('settings-panel').classList.toggle('open');
  document.querySelector(`input[name="viewmode"][value="${viewMode}"]`).checked = true;
}
function setViewMode(mode) {
  viewMode = mode;
  localStorage.setItem('view_mode', mode);
  activeDevice = null;
  document.getElementById('settings-panel').classList.remove('open');
  renderAll();
}
function showDeviceList()    { activeDevice = null; renderAll(); }
function showDeviceDetail(c) { activeDevice = c;    renderAll(); }
function setConnStatus(cls, text) {
  document.getElementById('conn-dot').className   = 'conn-dot '+cls;
  document.getElementById('conn-text').textContent = text;
}

// ==================== RENDER ====================
function renderAll() {
  document.getElementById('back-btn').style.display =
    (viewMode==='list' && activeDevice) ? 'inline-block' : 'none';

  const names = Object.keys(devices);
  if (names.length === 0) {
    document.getElementById('empty-state').style.display = 'block';
    document.getElementById('devices-grid').innerHTML = '';
    return;
  }
  document.getElementById('empty-state').style.display = 'none';
  const grid = document.getElementById('devices-grid');

  if (viewMode === 'all') {
    grid.className = 'devices-grid';
    grid.innerHTML = names.map(c => cardHTML(c, true)).join('');
  } else if (activeDevice && devices[activeDevice]) {
    grid.className = '';
    const disp = getDisp(activeDevice);
    grid.innerHTML = `<div class="device-detail-header"><h2>${disp.name}</h2></div>${cardHTML(activeDevice, true)}`;
  } else {
    grid.className = '';
    grid.innerHTML = names.map(cihaz => {
      const d = devices[cihaz], disp = getDisp(cihaz);
      return `<div class="device-list-item" onclick="showDeviceDetail('${cihaz}')">
        <div class="device-list-left">
          <div class="device-icon" onclick="openDeviceModal('${cihaz}')">${iconHTML(disp)}</div>
          <div>
            <div class="device-name-wrap">${disp.name}</div>
            <div class="device-list-meta">${paramBadgeHTML(cihaz)} parametre</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="device-status ${d.status==='online'?'online':'offline'}">● ${d.status==='online'?'Online':'Offline'}</span>
          <span class="device-list-arrow">→</span>
        </div>
      </div>`;
    }).join('');
  }
}

// ==================== YARDIMCI ====================
function getDisp(cihaz) {
  const cfg = deviceCfg[cihaz]||{};
  return { name:cfg.name||cihaz, icon:cfg.icon||'📦', photo:cfg.photo||null };
}
function iconHTML(disp) {
  return disp.photo
    ? `<img src="${disp.photo}" alt="" style="width:30px;height:30px;border-radius:9px;object-fit:cover;">`
    : disp.icon;
}
function paramInfo(cihaz) {
  const d=devices[cihaz]||{}, cfg=deviceCfg[cihaz]||{};
  const active=Object.keys(d.sensors||{});
  const seen=d.seenParams?[...d.seenParams]:active;
  const expList=cfg.expectedParams!=null?seen.slice(0,cfg.expectedParams):seen;
  const expCount=cfg.expectedParams!=null?cfg.expectedParams:seen.length;
  const missing=expList.filter(p=>!active.includes(p));
  return { text:`${active.length}/${expCount}`, warn:missing.length>0, missing };
}
function paramBadgeHTML(cihaz) {
  const pi=paramInfo(cihaz);
  if (!pi.warn) return `<span class="param-badge">${pi.text}</span>`;
  const items=pi.missing.map(p=>{
    const m=SENSOR_META[p]||{label:p,icon:'📊'};
    return `<div class="param-tooltip-item">${m.icon} ${m.label} gözükmüyor</div>`;
  }).join('');
  return `<span class="param-badge warn"><span class="param-dot"></span>${pi.text}
    <div class="param-tooltip"><div class="param-tooltip-title">Eksik parametreler</div>${items}</div></span>`;
}

// ==================== KART ====================
function cardHTML(cihaz, showChart) {
  const d=devices[cihaz], disp=getDisp(cihaz);
  const online=d.status==='online';
  const lastUpd=d.lastUpdate?'Son güncelleme: '+d.lastUpdate.toLocaleTimeString('tr-TR'):'Bekleniyor...';

  const sensorsHTML=Object.entries(d.sensors).map(([s,v])=>{
    const m=SENSOR_META[s]||{label:s,unit:'',icon:'📊'};
    return `<div class="sensor-item">
      <div class="sensor-label">${m.icon} ${m.label}</div>
      <div class="sensor-value">${v}<span class="sensor-unit">${m.unit}</span></div>
    </div>`;
  }).join('')||'<div style="color:var(--muted);font-size:13px;padding:8px">Henüz veri yok</div>';

  return `<div class="device-card">
    <div class="device-header">
      <div class="device-name-wrap">
        <div class="device-icon" onclick="openDeviceModal('${cihaz}')">${iconHTML(disp)}</div>
        ${disp.name}
      </div>
      <div class="device-header-right">
        ${paramBadgeHTML(cihaz)}
        <span class="device-status ${online?'online':'offline'}">● ${online?'Online':'Offline'}</span>
      </div>
    </div>
    <div class="sensors-grid">${sensorsHTML}</div>
    ${showChart ? chartsHTML(cihaz) : ''}
    <div class="device-footer">
      <span>${lastUpd}</span>
      <span>cihazlar/${cihaz}/canli</span>
    </div>
  </div>`;
}

// ==================== GRAFİK ====================
function chartsHTML(cihaz) {
  return CHART_PARAMS.map(param => {
    const key    = cihaz+'_'+param;
    const mode   = chartModes[key]||'live';
    const meta   = SENSOR_META[param];
    const {data} = getChartData(cihaz, param);
    const labels = {live:'Canlı','15m':'15 dk','1d':'1 Gün'};

    const menuHTML = ['live','15m','1d'].map(m=>
      `<div class="chart-menu-item ${mode===m?'active':''}" onclick="setChartMode('${cihaz}','${param}','${m}')">
        ${labels[m]} ${mode===m?'<span style="color:var(--accent)">✓</span>':''}
      </div>`
    ).join('');

    const bodyHTML = data.length < 2
      ? `<div class="chart-loading">${mode==='live'?'Veri birikmesi bekleniyor...':'Yükleniyor...'}</div>`
      : sparklineHTML(data, meta.color, meta.unit);

    return `<div class="chart-section">
      <div class="chart-header">
        <div class="chart-label">
          ${meta.icon} ${meta.label}
          <span class="chart-mode-badge">${labels[mode]}</span>
        </div>
        <div class="chart-menu-wrap">
          <button class="chart-menu-btn" onclick="toggleChartMenu('${key}')">⋯</button>
          <div class="chart-menu" data-key="${key}">${menuHTML}</div>
        </div>
      </div>
      <div class="chart-body" id="chartbody_${key}">${bodyHTML}</div>
    </div>`;
  }).join('');
}

function sparklineHTML(data, color, unit) {
  const W=320, H=96, PX=38, PY=10;
  const vals=data.map(d=>d.v), times=data.map(d=>d.t);
  const minV=Math.min(...vals), maxV=Math.max(...vals), rng=(maxV-minV)||1;

  const pts=vals.map((v,i)=>{
    const x=PX+(i/(vals.length-1))*(W-PX-8);
    const y=PY+(1-(v-minV)/rng)*(H-PY*2);
    return [x.toFixed(1), y.toFixed(1)];
  });

  const polyline=pts.map(p=>p.join(',')).join(' ');
  const area=`${pts[0][0]},${H-PY} `+pts.map(p=>p.join(',')).join(' ')+` ${pts[pts.length-1][0]},${H-PY}`;
  const lp=pts[pts.length-1];
  const lastVal=vals[vals.length-1].toFixed(1);
  const avg=(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);

  const tFmt=(t,i,arr)=>{
    const d=new Date(t);
    return d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
  };
  const tIdxs=[0,Math.floor(vals.length/2),vals.length-1];
  const tXs=[PX, PX+(W-PX-8)/2, W-8];
  const yVals=[maxV,(minV+maxV)/2,minV];
  const yYs=[PY, H/2, H-PY];

  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" style="height:${H}px">
    <defs>
      <linearGradient id="g${color.replace('#','')}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity=".2"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${yYs.map(y=>`<line x1="${PX}" y1="${y}" x2="${W-4}" y2="${y}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,4"/>`).join('')}
    ${yVals.map((v,i)=>`<text x="${PX-4}" y="${yYs[i]+4}" font-size="8" fill="var(--muted)" text-anchor="end" font-family="monospace">${v.toFixed(1)}</text>`).join('')}
    <polygon points="${area}" fill="url(#g${color.replace('#','')})"/>
    <polyline points="${polyline}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${lp[0]}" cy="${lp[1]}" r="4" fill="${color}" stroke="var(--surface)" stroke-width="2"/>
    <text x="${Math.min(parseFloat(lp[0])+8,W-40)}" y="${parseFloat(lp[1])+4}" font-size="10" fill="${color}" font-family="monospace" font-weight="bold">${lastVal}${unit}</text>
    ${tIdxs.map((idx,i)=>`<text x="${tXs[i]}" y="${H+2}" font-size="8" fill="var(--muted)" text-anchor="${i===0?'start':i===1?'middle':'end'}" font-family="monospace">${tFmt(times[idx],i,times)}</text>`).join('')}
  </svg>
  <div class="chart-stats">
    <div class="chart-stat"><span>Min </span>${minV.toFixed(1)}${unit}</div>
    <div class="chart-stat"><span>Maks </span>${maxV.toFixed(1)}${unit}</div>
    <div class="chart-stat"><span>Ort </span>${avg}${unit}</div>
    <div class="chart-stat"><span>Ölçüm </span>${vals.length}</div>
  </div>`;
}

// ==================== OTO GİRİŞ ====================
window.addEventListener('load', () => {
  if (localStorage.getItem('dash_auth') === '1') {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display    = 'block';
    startListening();
  }
});

document.addEventListener('keydown', e => {
  if (e.key==='Enter' && document.getElementById('login-screen').style.display!=='none') doLogin();
});

document.addEventListener('click', e => {
  const panel=document.getElementById('settings-panel');
  if (panel.classList.contains('open') && !panel.contains(e.target) && !e.target.closest('.icon-btn'))
    panel.classList.remove('open');
  if (document.getElementById('device-modal').classList.contains('open') &&
      e.target===document.getElementById('device-modal'))
    closeDeviceModal();
  if (!e.target.closest('.chart-menu-wrap'))
    document.querySelectorAll('.chart-menu.open').forEach(m=>m.classList.remove('open'));
});
</script>
</body>
</html>
